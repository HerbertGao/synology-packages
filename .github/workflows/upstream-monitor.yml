name: upstream-monitor

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Issue sync only on the default branch. Upgrade PRs, Releases, Pages, and NAS
    # installs require explicit maintainer authorization outside this workflow.
    # Do not dispatch cloud agents or other workflows from this job.
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"

      - name: Validate upstream monitor manifest
        run: node scripts/check-upstreams.mjs --validate

      - name: Run upstream monitor unit tests
        run: node --test scripts/check-upstreams.test.mjs

      - name: Compare upstream pins (report)
        run: |
          set -o pipefail
          node scripts/check-upstreams.mjs |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sync tracking issue
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          node scripts/check-upstreams.mjs --sync-issue |
            tee -a "$GITHUB_STEP_SUMMARY"