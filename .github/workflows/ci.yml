name: synology-packages-ci

# PRs: full CI on the merge candidate. master: post-merge verification.
# Feature-branch push alone does not trigger this workflow (avoids push+pull_request duplicates).
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      openlist: ${{ steps.filter.outputs.openlist }}
      easytier: ${{ steps.filter.outputs.easytier }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect path changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            openlist:
              - 'packages/openlist/**'
              - 'scripts/build-openlist.sh'
              - 'scripts/apply-overlay.sh'
              - 'scripts/patch-spksrc-local-publisher.sh'
              - '.github/workflows/ci.yml'
            easytier:
              - 'packages/easytier/**'
              - 'scripts/build-easytier.sh'
              - 'scripts/report-easytier-spk-artifacts.sh'
              - 'scripts/test-easytier-glibc-max.sh'
              - 'scripts/apply-overlay.sh'
              - 'scripts/patch-spksrc-local-publisher.sh'
              - '.github/workflows/ci.yml'

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"

      - name: Run static checks
        run: ./scripts/ci-run-checks.sh

  spk-build:
    runs-on: ubuntu-latest
    needs: [changes, static-checks]
    if: >-
      needs.static-checks.result == 'success' &&
      needs.changes.outputs.openlist == 'true'
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build SPK in SynoCommunity container
        run: |
          docker pull ghcr.io/synocommunity/spksrc
          docker run --rm --platform=linux/amd64 \
            -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/synocommunity/spksrc \
            bash -lc 'apt-get update && apt-get install -y rsync && chmod +x scripts/*.sh && ./scripts/build-openlist.sh'

      - name: Upload SPK artifacts
        if: success()
        uses: actions/upload-artifact@1eb3cb2b3e0f29609092a73eb033bb759a334595 # v4.1.0
        with:
          name: openlist-spk-apollolake-7.3
          path: .build/spksrc/packages/*.spk
          if-no-files-found: warn

  easytier-spk-build:
    runs-on: ubuntu-latest
    needs: [changes, static-checks]
    if: >-
      needs.static-checks.result == 'success' &&
      needs.changes.outputs.easytier == 'true'
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build EasyTier SPKs (apollolake + kvmx64) in SynoCommunity container
        run: |
          docker pull ghcr.io/synocommunity/spksrc
          docker run --rm --platform=linux/amd64 \
            -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/synocommunity/spksrc \
            bash -lc 'apt-get update && apt-get install -y rsync && chmod +x scripts/*.sh && EASYTIER_BUILD_ARCHES="apollolake kvmx64" ./scripts/build-easytier.sh'

      - name: Fix .build ownership after Docker
        if: success()
        run: sudo chown -R "$(id -u):$(id -g)" .build

      - name: GLIBC version gate (each built SPK)
        if: success()
        run: |
          shopt -s nullglob
          spks=(.build/spksrc/packages/EasyTier_*.spk .build/spksrc/spk/EasyTier/*.spk)
          if [ "${#spks[@]}" -eq 0 ]; then
            echo "FAIL: no EasyTier SPK produced" >&2
            exit 1
          fi
          for spk in "${spks[@]}"; do
            work="$(mktemp -d)"
            tar -xf "${spk}" -C "${work}" package.tgz INFO
            tar -xzf "${work}/package.tgz" -C "${work}"
            echo "GLIBC check for $(basename "${spk}")"
            ./scripts/test-easytier-glibc-max.sh \
              "${work}/bin/easytier-core" \
              "${work}/bin/helper/caphelper"
            rm -rf "${work}"
          done

      - name: Write EasyTier SPK report
        if: success()
        run: |
          chmod +x scripts/*.sh
          ./scripts/report-easytier-spk-artifacts.sh .build/spksrc/packages .build/easytier-spk-report.md
          cat .build/easytier-spk-report.md

      - name: Upload EasyTier SPK artifacts
        if: success()
        uses: actions/upload-artifact@1eb3cb2b3e0f29609092a73eb033bb759a334595 # v4.1.0
        with:
          name: easytier-spk-apollolake-kvmx64-7.3
          path: |
            .build/spksrc/packages/EasyTier_*.spk
            .build/easytier-spk-report.md
          if-no-files-found: error