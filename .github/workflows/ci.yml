name: synology-packages-ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"

      - name: Run static checks
        run: ./scripts/ci-run-checks.sh

  spk-build:
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build SPK in SynoCommunity container
        run: |
          docker pull ghcr.io/synocommunity/spksrc
          docker run --rm --platform=linux/amd64 \
            -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/synocommunity/spksrc \
            bash -lc 'apt-get update && apt-get install -y rsync && chmod +x scripts/*.sh && ./scripts/build-openlist.sh'

      - name: Upload SPK artifacts
        if: success()
        uses: actions/upload-artifact@1eb3cb2b3e0f29609092a73eb033bb759a334595 # v4.1.0
        with:
          name: openlist-spk-apollolake-7.3
          path: .build/spksrc/packages/*.spk
          if-no-files-found: warn

  easytier-spk-build:
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build EasyTier SPK in SynoCommunity container
        run: |
          docker pull ghcr.io/synocommunity/spksrc
          docker run --rm --platform=linux/amd64 \
            -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/synocommunity/spksrc \
            bash -lc 'apt-get update && apt-get install -y rsync && chmod +x scripts/*.sh && ./scripts/build-easytier.sh'

      - name: GLIBC version gate (easytier-core, caphelper)
        if: success()
        run: |
          shopt -s nullglob
          spk=(.build/spksrc/packages/EasyTier_*.spk .build/spksrc/spk/EasyTier/*.spk)
          if [ "${#spk[@]}" -eq 0 ]; then
            echo "WARN: no SPK found for glibc check"
            exit 0
          fi
          work=".build/easytier-spk-inspect"
          rm -rf "${work}"
          mkdir -p "${work}"
          tar -xzf "${spk[0]}" -C "${work}" package.tgz
          tar -xzf "${work}/package.tgz" -C "${work}"
          ./scripts/test-easytier-glibc-max.sh \
            "${work}/bin/easytier-core" \
            "${work}/bin/helper/caphelper"

      - name: Upload EasyTier SPK artifacts
        if: success()
        uses: actions/upload-artifact@1eb3cb2b3e0f29609092a73eb033bb759a334595 # v4.1.0
        with:
          name: easytier-spk-apollolake-7.3
          path: .build/spksrc/packages/*.spk
          if-no-files-found: warn